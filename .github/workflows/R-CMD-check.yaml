name: R-CMD-check

on:
  push:
  pull_request:

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install the Python side so the testthat suite runs instead of skipping.
      - name: Install BayesForge (Python)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          # BayesForge `dev`: the tests use features not yet on PyPI
          # (e.g. m$data(<data.frame>)). From the zip archive, not git: BF has a
          # file name with ":" that git cannot check out on Windows.
          python -m pip install "bayesforge[cpu] @ https://github.com/BGN-for-ASNA/BF/archive/refs/heads/dev.zip"
          echo "RETICULATE_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      # Installs the package's own dependencies from DESCRIPTION (Imports and
      # Suggests: abind, posterior, testthat, ...) plus rcmdcheck. With
      # `packages:` instead of `extra-packages:` only the listed packages were
      # installed, and R CMD check stopped on "Package required but not
      # available: 'abind'".
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check


      - name: Check R package
        run: |
          rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "warning", check_dir = "check")
        shell: Rscript {0}